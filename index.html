<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <!-- iOS Safari tints the status bar and toolbar from theme-color (white without it). -->
    <meta name="theme-color" content="#010407" />
    <meta name="color-scheme" content="dark" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>olle.work</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { height: 100%; overflow: hidden; background: #010407; }
      body {
        background:
          radial-gradient(120% 90% at 50% 45%, #02160f 0%, #010a08 45%, #010407 100%);
        font-family: ui-sans-serif, system-ui, -apple-system, "Helvetica Neue", sans-serif;
        color: rgba(190, 255, 220, 0.55);
        -webkit-font-smoothing: antialiased;
      }
      #app { position: fixed; inset: 0; }
      #app canvas { display: block; touch-action: none; }
      .overlay {
        position: fixed;
        pointer-events: none;
        user-select: none;
        letter-spacing: 0.04em;
        z-index: 5;
      }
      .brand {
        top: 22px; left: 26px;
        font-size: 12px;
        font-family: inherit;
        letter-spacing: 0.04em;
        color: rgba(190, 255, 220, 0.8);
        background: none; border: 0; padding: 4px 0; cursor: pointer;
        pointer-events: auto; user-select: none;
      }
      .brand:hover { color: rgba(190, 255, 220, 1); }
      .brand.copied { color: rgba(190, 255, 220, 0.55); }
      .hint { display: none; }
      .blm-toggle { display: none !important; }
      @media (max-width: 640px) {
        .brand { top: 16px; left: 18px; }
        .hint { bottom: 14px; left: 18px; }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <button class="overlay brand" id="mail" type="button" title="copy address">hi@olle.work</button>
    <span id="backend-tag" hidden></span>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
