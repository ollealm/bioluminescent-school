<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <!-- iOS Safari tints the status bar and toolbar from theme-color (white without it). -->
    <meta name="theme-color" content="#010407" />
    <meta name="color-scheme" content="dark" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>bioluminescent school</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { height: 100%; overflow: hidden; background: #010407; }
      body {
        background:
          radial-gradient(120% 90% at 50% 45%, #02160f 0%, #010a08 45%, #010407 100%);
        font-family: ui-sans-serif, system-ui, -apple-system, "Helvetica Neue", sans-serif;
        color: rgba(190, 255, 220, 0.55);
        -webkit-font-smoothing: antialiased;
      }
      #app { position: fixed; inset: 0; }
      #app canvas { display: block; touch-action: none; }
      /* The panel opens with D; the page is the school alone. */
      .blm-toggle { display: none !important; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <span id="backend-tag" hidden></span>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
