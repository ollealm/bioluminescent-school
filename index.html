<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>bioluminescent swarm · gpu fork</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { height: 100%; overflow: hidden; }
      body {
        background:
          radial-gradient(120% 90% at 50% 45%, #02160f 0%, #010a08 45%, #010407 100%);
        font-family: ui-sans-serif, system-ui, -apple-system, "Helvetica Neue", sans-serif;
        color: rgba(190, 255, 220, 0.55);
        -webkit-font-smoothing: antialiased;
      }
      #app { position: fixed; inset: 0; }
      #app canvas { display: block; touch-action: none; }
      .overlay {
        position: fixed;
        pointer-events: none;
        user-select: none;
        letter-spacing: 0.04em;
        z-index: 5;
      }
      .brand {
        top: 22px; left: 26px;
        font-size: 12px;
        text-transform: lowercase;
        color: rgba(190, 255, 220, 0.45);
      }
      .brand strong { color: rgba(190, 255, 220, 0.8); font-weight: 600; }
      .hint {
        bottom: 20px; left: 26px;
        font-size: 11px;
        color: rgba(190, 255, 220, 0.32);
      }
      @media (max-width: 640px) {
        .brand { top: 16px; left: 18px; }
        .hint { bottom: 14px; left: 18px; }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div class="overlay brand"><strong>olle.work</strong> · bioluminescent school <span id="backend-tag">v4</span></div>
    <div class="overlay hint">drag through the swarm · click for a cascade · press D for controls</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
